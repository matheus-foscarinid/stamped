<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stamp the countries you've been to on a world map, then share it as a link or an image." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // mirrors src/theme/themes.ts, so the first paint already wears the saved theme
      try {
        let theme = localStorage.getItem('stamped-theme') || 'auto'
        if (theme === 'auto') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>"
    />
    <title>Stamped</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
